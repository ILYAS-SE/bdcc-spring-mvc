<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout1}">
<body>
<div layout:fragment="content">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header"
                     th:text="${product.id == null} ? 'Nouveau produit' : 'Modifier le produit #' + ${product.id}"></div>
                <div class="card-body">
                    <form method="post" th:action="@{/admin/saveProduct}" th:object="${product}">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Nom</label>
                            <input type="text" class="form-control" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                            <span class="text-danger" th:errors="*{name}"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Prix</label>
                            <input type="text" class="form-control" th:field="*{price}"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                            <span class="text-danger" th:errors="*{price}"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantite</label>
                            <input type="text" class="form-control" th:field="*{quantity}"
                                   th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'">
                            <span class="text-danger" th:errors="*{quantity}"></span>
                        </div>

                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                        <a class="btn btn-outline-secondary" th:href="@{/user/index}">Annuler</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
