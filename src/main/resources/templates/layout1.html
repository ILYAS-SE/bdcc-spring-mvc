<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestion des produits</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/user/index}">BDCC Produits</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/user/index}">Produits</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/newProduct}">Nouveau produit</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center" sec:authorize="isAuthenticated()">
                <li class="nav-item text-white me-3">
                    Connecte : <strong sec:authentication="name">user</strong>
                    <span class="badge bg-light text-primary ms-1" sec:authentication="principal.authorities">ROLE</span>
                </li>
                <li class="nav-item">
                    <!-- Logout en POST : th:action ajoute le jeton CSRF -->
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-3">
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <!-- Partie qui change d'une page a l'autre -->
    <div layout:fragment="content"></div>
</div>

<footer class="text-center text-muted border-top mt-5 py-3">
    <small>&copy; BDCC - Spring MVC, Spring Data JPA, Thymeleaf &amp; Spring Security</small>
</footer>
</body>
</html>
